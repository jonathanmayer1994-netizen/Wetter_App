<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>MapLibre GL JS — 3D Alpen Wetterkarte (60 FPS WebGL & Apple Liquid Glass)</title>
  <meta name="description" content="Hardwarebeschleunigte 60 FPS WebGL Wetterkarte mit 3D-Alpen-Relief, nahtlosem RainViewer Live-Radar & 2h-Nowcast, alpinen Messnetzen und Apple Liquid-Glassmorphism UI.">
  
  <!-- Apple Web App & PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alpen Wetterkarte">
  <meta name="theme-color" content="#060a12">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- MapLibre GL JS v4.7.1 CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Base Application Stylesheet (including Liquid Glass Tokens) -->
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060a12;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }

    #demo-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #demo-map {
      width: 100%;
      height: 100%;
    }

    /* Back Link / Brand Header */
    .brand-overlay {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
    }

    .brand-badge:hover {
      transform: translateY(-1px);
    }

    .fps-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #4ade80;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      padding: 2px 7px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div id="demo-container" class="maplibre-weather-container">
    <!-- WebGL MapLibre Canvas Container -->
    <div id="demo-map"></div>

    <!-- Brand / Back Link Badge -->
    <div class="brand-overlay">
      <a href="index.html" class="brand-badge liquid-glass-panel" title="Zurück zur Wetter-App">
        <span>← Zurück zur App</span>
        <span class="fps-badge">60 FPS WebGL</span>
      </a>
    </div>

    <!-- 1. Sleek Top Liquid Glass Dock -->
    <div class="maplibre-top-dock liquid-glass-dock" style="left: 175px;">
      <div class="maplibre-top-controls">
        <button class="maplibre-toggle-pill active" id="maplibre-terrain-toggle-btn" title="3D-Relief & Hillshading an/aus">
          🏔️ 3D Alpen-Relief
        </button>
        <button class="maplibre-toggle-pill" id="maplibre-marine-toggle-btn" title="Küste, Wellenhöhe & Wassertemperatur">
          🌊 Marine-Modus
        </button>
      </div>

      <div class="maplibre-altitude-badge" id="maplibre-altitude-badge">
        🏔️ <strong>Tal / Boden</strong> (500 m, 1013 hPa) • Wind: <strong>18 km/h</strong> • Temp: <strong>10.8°C</strong>
      </div>
    </div>

    <!-- 2. Floating Altitude & Pressure Selector Dock (Right Side) -->
    <div class="altitude-selector-dock liquid-glass-panel">
      <button class="alt-level-btn" data-alt="4200" title="4.200 m (600 hPa) - Freie Höhenströmung Alpenhauptkamm">
        <span>4.200 m</span>
        <small>600 hPa</small>
      </button>
      <button class="alt-level-btn" data-alt="3000" title="3.000 m (700 hPa) - Hochalpine Gipfellage">
        <span>3.000 m</span>
        <small>700 hPa</small>
      </button>
      <button class="alt-level-btn" data-alt="2000" title="2.000 m (800 hPa) - Kammlagen & Pässe">
        <span>2.000 m</span>
        <small>800 hPa</small>
      </button>
      <button class="alt-level-btn" data-alt="1000" title="1.000 m (900 hPa) - Mittelgebirge & Almtäler">
        <span>1.000 m</span>
        <small>900 hPa</small>
      </button>
      <button class="alt-level-btn active" data-alt="500" title="Tal / Boden (2m / 10m - 1013 hPa)">
        <span>Tal / Boden</span>
        <small>2m / 10m</small>
      </button>
    </div>

    <!-- 3. Bottom Player Dock (Liquid-Glass Floating Dock) -->
    <div class="maplibre-player-dock liquid-glass-dock">
      <!-- Row 1: Radar Mode Chip, Time Banner & Legend -->
      <div class="maplibre-player-topline">
        <div class="maplibre-time-block">
          <span class="radar-mode-chip live" id="maplibre-radar-status-chip">📡 Doppler-Radar</span>
          <span class="maplibre-time-text" id="maplibre-radar-time-text">🔴 LIVE • Jetzt</span>
          <button class="maplibre-toggle-pill" id="maplibre-radar-jump-live" style="padding: 4px 10px; font-size: 11px;">
            🔴 Jetzt
          </button>
        </div>

        <div class="maplibre-legend-row">
          <span style="opacity:0.75; font-size: 11px;">Intensität:</span>
          <div class="maplibre-legend-bar" title="Niesel → Mäßig → Starkregen → Schnee / Hagel"></div>
          <span style="font-size: 11px; opacity:0.85;">Niesel / Schnee</span>
        </div>
      </div>

      <!-- Row 2: Transport Buttons & Scrubber Slider -->
      <div class="maplibre-player-controls">
        <div class="maplibre-transport-btns">
          <button id="maplibre-radar-prev-btn" class="maplibre-ctrl-btn" title="10 Min zurück">⏮</button>
          <button id="maplibre-radar-play-btn" class="maplibre-ctrl-btn maplibre-play-btn" title="Live-Radar abspielen / pausieren">▶</button>
          <button id="maplibre-radar-next-btn" class="maplibre-ctrl-btn" title="10 Min vor">⏭</button>
          <button id="maplibre-radar-speed-btn" class="maplibre-ctrl-btn maplibre-speed-btn" title="Geschwindigkeit umschalten">1x</button>
        </div>

        <div class="maplibre-slider-wrap">
          <input type="range" id="maplibre-radar-slider" class="liquid-slider" min="0" max="30" value="12" step="1">
        </div>
      </div>
    </div>

    <!-- 4. iOS Liquid-Glass Bottom Sheet Modal for Stations -->
    <div class="station-bottom-sheet liquid-glass-panel" id="maplibre-bottom-sheet">
      <div class="sbs-handle-bar" onclick="document.getElementById('maplibre-bottom-sheet').classList.remove('visible')"></div>
      
      <div class="sbs-header">
        <div class="sbs-title-wrap">
          <span class="sbs-title" id="sbs-title">Zugspitze Gipfel</span>
          <div class="sbs-sub">
            <span id="sbs-elevation">2.962 m ü. M.</span>
            <span class="sbs-agency-badge" id="sbs-agency-badge">LAWIS</span>
          </div>
        </div>
        <button class="sbs-close-btn" id="sbs-close-btn" title="Schließen">✕</button>
      </div>

      <div class="sbs-grid">
        <div class="sbs-card">
          <span class="sbs-card-label">Temperatur</span>
          <span class="sbs-card-val" id="sbs-temp-val">-2.4°C</span>
          <span class="sbs-card-sub" id="sbs-dew-val">Taupunkt: -5.1°C</span>
        </div>

        <div class="sbs-card">
          <span class="sbs-card-label">Schnee</span>
          <span class="sbs-card-val" id="sbs-snow-val">145 cm</span>
          <span class="sbs-card-sub" id="sbs-fresh-snow-val">24h Neuschnee: +15 cm</span>
        </div>

        <div class="sbs-card">
          <span class="sbs-card-label">Wind & Böen</span>
          <span class="sbs-card-val" id="sbs-wind-val">42 km/h</span>
          <div class="sbs-wind-row sbs-card-sub">
            <span class="sbs-compass-needle" id="sbs-compass-needle">↑</span>
            <span id="sbs-wind-dir-text">250° (WSW)</span>
          </div>
        </div>
      </div>

      <div class="sbs-actions">
        <button class="sbs-action-btn" id="sbs-select-location-btn">
          📍 Details in Best Weather öffnen
        </button>
      </div>
    </div>
  </div>

  <!-- Component Script Module -->
  <script type="module">
    import { MapLibreWeatherMap } from './maplibreWeatherMap.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const weatherMap = new MapLibreWeatherMap({
        containerId: 'demo-map',
        onStationSelect: (st) => {
          console.log('Selected Station:', st);
          // Optional: Weiterleitung zur Haupt-App mit Geo-Koordinaten
          const targetUrl = `index.html?lat=${st.lat}&lon=${st.lon}&name=${encodeURIComponent(st.name)}&elev=${st.elevation}`;
          window.location.href = targetUrl;
        }
      });

      await weatherMap.init();
      window.weatherMapInstance = weatherMap;
    });
  </script>
</body>
</html>
